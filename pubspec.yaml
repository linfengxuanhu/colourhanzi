name: hanzi_color_app
description: 幼儿识字启蒙汉字找字涂色练习
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 保存生成的练习图片
  path_provider: ^2.1.5

  # 分享生成的练习图片
  share_plus: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 楷体字体
  fonts:
    - family: KaiTi
      fonts:
        - asset: assets/fonts/KaiTi.ttf
